[project]
name = "employ-law-agent"
version = "0.1.0"
description = "Corrective Agentic RAG assistant for Malaysia's Employment Act 1955"
readme = "README.md"
authors = [
    { name = "xiaoshi", email = "yxs0804@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.4.9",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.6",
    "langchain-huggingface>=1.2.3",
    "langchain-openrouter>=0.2.9",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "pandas>=3.1.1",
    "pydantic>=2",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
employ-law-agent = "employ_law_agent:main"
ingest-act = "employ_law_agent.ingest:main"
build-vectorstore = "employ_law_agent.vectorstore:main"
eval-agent = "employ_law_agent.evaluate:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
